[project]
name = "gfunk"
version = "0.0.0"
description = "MCP server and CLI for programmatic Google Workspace access"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
    "mcp>=2.0.0",
    "tabulate>=0.10.0",
    "textual>=3.0.0",
    "xhtml2pdf>=0.2.17",
]

[project.scripts]
gfunk = "gfunk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfunk"]

[dependency-groups]
dev = [
    "commitizen>=4.10.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.5",
    "types-tabulate>=0.10.0.20260508",
]

[tool.pytest.ini_options]
addopts = "-n 6"
testpaths = ["tests"]
filterwarnings = [
    "ignore::ResourceWarning:importlib.metadata",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
warn_unreachable = true
# google-auth ships py.typed but leaves its own internals untyped; that is a
# gap in the dependency, not a call we can annotate our way out of.
untyped_calls_exclude = ["google.oauth2", "google.auth"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "xhtml2pdf.*"]
ignore_missing_imports = true
